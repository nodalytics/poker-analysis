    <path d="M122 26 L112 38 L117 40 L103 47 L101 40 Z M6 26 L16 38 L11 40 L25 47 L27 40 Z" fill="#1E293B" fill-opacity="0.85"/>
    <path d="M80.6 93.5 L84 104 L72 99 L64 106 L56 99 L44 104 L47.4 93.5 Z" fill="#1E293B" fill-opacity="0.85"/>
