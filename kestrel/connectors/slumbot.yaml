# Slumbot (slumbot.com): a strong heads-up no-limit bot with a public API that other bots play against.
# 200bb, reset every hand. A connector is yours to write: list the platform's routes as they are, say which route
# plays each step of a hand, and where each answer sits in the responses.
name: slumbot
game: {variant: nlhe, players: 2, blinds: [50, 100], stack: 20000, reset_every_hand: true}
codec: acpc                    # action strings: k c f b<street total>, streets separated by /

transport:
  base_url: https://slumbot.com/api/
  retry: {tries: 6, backoff_s: 2}
  rate_limit_per_s: 4          # a courtesy limit: keep the load on a free service small
  # headers: {Authorization: "Bearer ${env:KESTREL_SLUMBOT_KEY}"}   # sent with every route, if a platform needs it

routes:                        # the platform's API, as you list it
  login:
    method: POST
    path: login
    request:                   # the request's structure: body (any shape), query, headers, content_type
      body: {username: "${env:KESTREL_SLUMBOT_USER}", password: "${env:KESTREL_SLUMBOT_PASS}"}
    response:
      fields: {error: /error_msg}
  new_hand:
    method: POST
    path: new_hand
    request: {body: {token: "${token}"}}   # a lone placeholder with no value is left out (no token at first)
  act:
    method: POST
    path: act
    request: {body: {token: "${token}", incr: "${action}"}}
    # response: {fields: {...}}  # a route may override any of the fields below

flow:                          # which route plays each step; login is optional and runs once per session
  start: new_hand
  act: act
  # login: login               # uncomment to play under your Slumbot account

session:
  token_field: /token          # carried into the next request as ${token}

fields:                        # the response's structure: where each answer is (JSON pointers)
  action: /action
  my_seat: /client_pos         # 0 big blind, 1 small blind
  hole: /hole_cards            # cards: a list ["As", "Kc"] or a string "AsKc" / "As Kc"
  board: /board
  result: /winnings            # present when the hand is over (chips)
  their_hole: /bot_hole_cards
  error: /error_msg
  # a field can also be {at: /pointer, scale: 0.01, map: {"BB": 0, "SB": 1}}: a scale for amounts in other units,
  # a map from the platform's values to ours
