# Host nginx vhost for the 9-max watch page (web/index.html, served by scripts/ninemax_watch.py on 127.0.0.1:8790).
# Installed by web/deploy/install.sh into /etc/nginx/sites-available and linked from sites-enabled.
# DNS: poker.stbfarm.org is proxied by Cloudflare (SSL mode Full); the origin certificate is the lab's own, shared
# with the other stbfarm.org vhosts. The app itself stays bound to 127.0.0.1; only nginx faces the network.

# Cloudflare's edge ranges (https://www.cloudflare.com/ips-v4 and ips-v6, fetched 2026-11-10; refresh if Cloudflare
# adds ranges). Only these, and the lab itself, may reach this site: anyone who finds the lab's IP and skips
# Cloudflare gets 403. Decided on the connection's own address, before the real-IP rewrite below.
geo $realip_remote_addr $poker_via_cf {
    default 0;
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# /api/live deals fresh hands on the CPU: at most 20 a minute per visitor (the real visitor: see set_real_ip_from)
limit_req_zone $binary_remote_addr zone=poker_live:1m rate=20r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poker.stbfarm.org;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    if ($poker_via_cf = 0) { return 403; }

    # the visitor's own address, from the header Cloudflare sets, trusted only from Cloudflare's ranges: without
    # this every request would seem to come from a Cloudflare server, and the rate limit would be per server
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Optional password (instead of, or as well as, Cloudflare Access): create the file with
    #   sudo htpasswd -c /etc/nginx/poker.htpasswd <user>     (apache2-utils)
    # and uncomment:
    # auth_basic "9-max watch";
    # auth_basic_user_file /etc/nginx/poker.htpasswd;

    location /api/live {
        limit_req zone=poker_live burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        limit_except GET HEAD { deny all; }  # the app is read-only
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name poker.stbfarm.org;
    return 301 https://$host$request_uri;
}
