# Builds the Poker Advisor app for Windows, macOS and Linux (PyInstaller cannot cross-compile, so each OS builds
# its own). Run it by hand from the Actions tab; the apps are attached to the run as artifacts.
name: advisor-build
on:
  workflow_dispatch:
  push:
    tags: ["advisor-v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: llm-research
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run --with pytest python -m pytest -q advisor/tests
      - run: uv run --with pyinstaller==6.22.3 python advisor/packaging/build.py
      - name: self-test the built app
        shell: bash
        run: |
          if [ -d dist/PokerAdvisor.app ]; then dist/PokerAdvisor.app/Contents/MacOS/PokerAdvisor --selftest
          elif [ -f dist/PokerAdvisor.exe ]; then dist/PokerAdvisor.exe --selftest
          else dist/PokerAdvisor --selftest; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAdvisor-${{ runner.os }}
          path: llm-research/dist/
