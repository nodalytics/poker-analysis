# Host nginx vhost for the 9-max watch page (web/index.html, served by scripts/ninemax_watch.py on 127.0.0.1:8790).
# Installed by web/deploy/install.sh into /etc/nginx/sites-available and linked from sites-enabled.
# DNS: poker.stbfarm.org is proxied by Cloudflare (SSL mode Full); the origin certificate is the lab's own, shared
# with the other stbfarm.org vhosts. The app itself stays bound to 127.0.0.1; only nginx faces the network.

# /api/live deals fresh hands on the CPU: at most 20 a minute per visitor
limit_req_zone $binary_remote_addr zone=poker_live:1m rate=20r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poker.stbfarm.org;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    # Optional password (instead of, or as well as, Cloudflare Access): create the file with
    #   sudo htpasswd -c /etc/nginx/poker.htpasswd <user>     (apache2-utils)
    # and uncomment:
    # auth_basic "9-max watch";
    # auth_basic_user_file /etc/nginx/poker.htpasswd;

    location /api/live {
        limit_req zone=poker_live burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        limit_except GET HEAD { deny all; }  # the app is read-only
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name poker.stbfarm.org;
    return 301 https://$host$request_uri;
}
