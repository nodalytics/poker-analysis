# Alternative: Ollama in Docker with all GPUs. NOT what the studies used (they ran the user-space install
# from install-ollama.sh) and not run on the lab, where it would clash with that server on port 11434.
# Needs the NVIDIA Container Toolkit. Image ollama/ollama:0.40.5 (Docker Hub digest sha256:5d3a2f25f982...).
services:
  ollama:
    image: ollama/ollama:0.40.5
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
      - ./tool-models:/tool-models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
volumes:
  ollama-models:
